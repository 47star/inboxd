[project]
name = "inboxd"
version = "0.1.0"
description = "Local communication archive and MCP query service"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12,<3.14"
keywords = ["archive", "mcp", "search", "macos", "slack"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: MacOS X",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Communications",
  "Topic :: Database :: Database Engines/Servers",
]
dependencies = [
  "click>=8.1",
  "rocksdict>=0.3.25",
  "tantivy>=0.24",
  "httpx>=0.28",
  "fastapi>=0.115",
  "uvicorn>=0.34",
  "mcp>=1.12,<2",
  "slack-sdk>=3.35",
  "aiohttp>=3.11",
  "watchfiles>=1.0",
  "pytypedstream>=0.1.0",
  "beautifulsoup4>=4.15.0",
  "cryptography>=50.0.2",
  "pypdf>=6.21.4",
]

[project.scripts]
inboxd = "inboxd.cli:main"
inboxd-mcp = "inboxd.api.mcp:main"

[project.entry-points."inboxd.collectors"]
messages = "inboxd.sources.messages:plugin"
mail = "inboxd.sources.mail:plugin"
slack = "inboxd.sources.slack:plugin"
redmine = "inboxd.sources.redmine:plugin"
google_calendar = "inboxd.sources.google:calendar_plugin"
google_tasks = "inboxd.sources.google:tasks_plugin"
calendar = "inboxd.sources.organizer:calendar_plugin"
notes = "inboxd.sources.organizer:notes_plugin"
reminders = "inboxd.sources.organizer:reminders_plugin"

[dependency-groups]
dev = ["pytest>=8", "ruff==0.17.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"native" = "inboxd/native"

[tool.ruff]
target-version = "py312"
line-length = 100
indent-width = 4

[tool.ruff.lint]
extend-select = ["E", "F", "I", "B", "UP"]

[tool.ruff.format]
indent-style = "space"
quote-style = "double"
line-ending = "lf"
skip-magic-trailing-comma = false
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
